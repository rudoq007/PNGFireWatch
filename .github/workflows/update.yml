name: Update PNG Fire Watch

on:
  schedule:
    # Twice a day: 08:15 and 20:15 Papua New Guinea time (UTC+10)
    - cron: "15 22 * * *"
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if there is no new fire data"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["index.html", "inputs/**", "pipeline/**", "config.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.data.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Calibrate NOAA-20 against Suomi NPP (first run only)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY || secrets.NASA_FIRSM_KEY || secrets.NASA_FIRMS_KEY }}
        run: |
          if [ ! -f inputs/calibration.json ] && [ -n "$FIRMS_MAP_KEY" ]; then
            python pipeline/calibrate.py || echo "Calibration failed; NOAA-20 counts stay unadjusted until it succeeds."
          fi
      - name: Fetch fire data (Suomi NPP from GFW to 21 Oct 2026, then NOAA-20 from NASA FIRMS)
        id: data
        env:
          GFW_API_KEY: ${{ secrets.GFW_API_KEY || secrets.GFW_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY || secrets.NASA_FIRSM_KEY || secrets.NASA_FIRMS_KEY }}
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python pipeline/update.py --out _site $FORCE
      - name: Make maps and reports
        if: steps.data.outputs.changed == 'true'
        run: python pipeline/outputs.py --out _site
      - name: Assemble site
        if: steps.data.outputs.changed == 'true'
        run: |
          cp index.html _site/
          touch _site/.nojekyll
      - name: Save extended history and new geostores
        if: steps.data.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inputs/history.json inputs/geostores.json inputs/firms_points.csv.gz
          if [ -f inputs/calibration.json ]; then git add inputs/calibration.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update fire history baseline [skip ci]" && git push || echo "Could not push; history will be rebuilt on the next run."
          fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.data.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    # Opens (or comments on) a GitHub issue when an update fails, so watchers get an email.
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'PNG Fire Watch update failed';
            const body = `The scheduled update failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe site keeps showing the last successful update until the next run succeeds.`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'update-failure' });
            if (open.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['update-failure'] });
            }
